<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Pedro Domiciano — Desenvolvedor Full Stack</title>
  <desc id="description">Banner em azul e ciano. Web, APIs e automação para engenharia, com um diagrama que conecta interface, lógica e dados.</desc>
  <defs>
    <linearGradient id="background" x1="20" y1="0" x2="1230" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="0.56" stop-color="#101B30"/>
      <stop offset="1" stop-color="#102947"/>
    </linearGradient>
    <linearGradient id="accent" x1="48" y1="0" x2="1228" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="name" x1="55" y1="210" x2="530" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#B9DEFF"/>
    </linearGradient>
    <linearGradient id="panel" x1="785" y1="105" x2="1145" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15263D"/>
      <stop offset="1" stop-color="#0D192C"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#557598" fill-opacity="0.2"/>
    </pattern>
    <clipPath id="bounds"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#bounds)">
    <rect width="1280" height="420" rx="24" fill="url(#background)"/>
    <path d="M720 0H1280V420H600Z" fill="url(#dots)"/>
    <circle cx="1050" cy="225" r="238" stroke="#38BDF8" stroke-opacity="0.09"/>
    <circle cx="1050" cy="225" r="188" stroke="#38BDF8" stroke-opacity="0.09"/>
    <circle cx="1050" cy="225" r="138" stroke="#38BDF8" stroke-opacity="0.07"/>
    <path d="M0 419H1280" stroke="url(#accent)" stroke-width="3"/>
    <path d="M56 0H1224" stroke="url(#accent)" stroke-width="4"/>

    <g font-family="Segoe UI, Arial, sans-serif">
      <rect x="56" y="38" width="54" height="40" rx="10" fill="#162A43" stroke="#2B4C6B"/>
      <text x="83" y="65" text-anchor="middle" fill="#7DD3FC" font-family="Consolas, monospace" font-size="21" font-weight="700">P/</text>
      <text x="126" y="64" fill="#94A3B8" font-family="Consolas, monospace" font-size="15" letter-spacing="2">PEDROHDA</text>
      <text x="1224" y="63" text-anchor="end" fill="#7F9AB8" font-family="Consolas, monospace" font-size="13" letter-spacing="2">CÓDIGO COM PROPÓSITO</text>

      <rect x="56" y="113" width="8" height="8" rx="4" fill="#38BDF8"/>
      <text x="76" y="123" fill="#7DD3FC" font-size="16" font-weight="600" letter-spacing="3">DESENVOLVEDOR FULL STACK</text>

      <text x="52" y="207" fill="#F8FAFC" font-size="76" font-weight="700" letter-spacing="-3">Pedro</text>
      <text x="52" y="285" fill="url(#name)" font-size="76" font-weight="700" letter-spacing="-3">Domiciano<tspan fill="#38BDF8">.</tspan></text>

      <text x="56" y="327" fill="#B2C2D7" font-size="21">Web, APIs e automação para engenharia.</text>
      <path d="M56 369H96" stroke="#38BDF8" stroke-width="2"/>
      <text x="110" y="374" fill="#839AB6" font-family="Consolas, monospace" font-size="14">React · TypeScript · C# · .NET</text>

      <rect x="756" y="110" width="458" height="250" rx="16" fill="#050C17" fill-opacity="0.25"/>
      <rect x="746" y="100" width="458" height="250" rx="16" fill="url(#panel)" stroke="#2B415F"/>
      <path d="M746 144H1204" stroke="#2B415F"/>
      <circle cx="770" cy="122" r="4" fill="#F58B86"/>
      <circle cx="786" cy="122" r="4" fill="#EAC16B"/>
      <circle cx="802" cy="122" r="4" fill="#67C9AB"/>
      <text x="1180" y="127" text-anchor="end" fill="#91A6C1" font-family="Consolas, monospace" font-size="13">da ideia à solução</text>

      <path d="M819 182H1166" stroke="#294867" stroke-dasharray="4 6"/>
      <text x="773" y="187" fill="#4C7195" font-family="Consolas, monospace" font-size="12">01</text>
      <text x="773" y="237" fill="#4C7195" font-family="Consolas, monospace" font-size="12">02</text>
      <text x="773" y="287" fill="#4C7195" font-family="Consolas, monospace" font-size="12">03</text>
      <path d="M842 193V224M842 243V274" stroke="#426384" stroke-width="2"/>
      <circle cx="842" cy="182" r="10" fill="#102A42" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="842" cy="232" r="10" fill="#25223F" stroke="#A78BFA" stroke-width="2"/>
      <circle cx="842" cy="282" r="10" fill="#103435" stroke="#2DD4BF" stroke-width="2"/>

      <rect x="870" y="166" width="311" height="33" rx="8" fill="#11253B" stroke="#244560"/>
      <text x="885" y="188" fill="#BAE6FD" font-family="Consolas, monospace" font-size="15">interface</text>
      <text x="1166" y="188" text-anchor="end" fill="#7497BA" font-family="Consolas, monospace" font-size="12">experiência</text>

      <rect x="870" y="216" width="311" height="33" rx="8" fill="#20223C" stroke="#41385B"/>
      <text x="885" y="238" fill="#DDD6FE" font-family="Consolas, monospace" font-size="15">lógica</text>
      <text x="1166" y="238" text-anchor="end" fill="#A396BF" font-family="Consolas, monospace" font-size="12">APIs e regras</text>

      <rect x="870" y="266" width="311" height="33" rx="8" fill="#102E34" stroke="#235054"/>
      <text x="885" y="288" fill="#99F6E4" font-family="Consolas, monospace" font-size="15">dados</text>
      <text x="1166" y="288" text-anchor="end" fill="#7CAEA9" font-family="Consolas, monospace" font-size="12">conexões</text>

      <text x="773" y="328" fill="#4C7195" font-family="Consolas, monospace" font-size="13">&gt;</text>
      <text x="795" y="328" fill="#94AFC9" font-family="Consolas, monospace" font-size="13">construir. integrar. evoluir.</text>
      <rect x="1085" y="316" width="7" height="15" fill="#38BDF8"/>
    </g>
  </g>
