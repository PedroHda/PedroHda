<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Pedro Domiciano — Desenvolvedor Full Stack</title>
  <desc id="description">Interfaces com propósito. APIs que conectam. Automações que simplificam. Web, desktop e mobile.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset=".5" stop-color="#13182D"/><stop offset="1" stop-color="#142640"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#A78BFA"/><stop offset=".5" stop-color="#818CF8"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
    <linearGradient id="name"><stop stop-color="#F8FAFC"/><stop offset=".53" stop-color="#DDD6FE"/><stop offset="1" stop-color="#A5F3FC"/></linearGradient>
    <radialGradient id="violet-glow"><stop stop-color="#8B5CF6" stop-opacity=".24"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyan-glow"><stop stop-color="#22D3EE" stop-opacity=".16"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#8492C4" stroke-opacity=".07"/></pattern>
    <clipPath id="clip"><rect width="1280" height="390" rx="24"/></clipPath>
  </defs>
  <style>
    .phrase{opacity:0;animation:phrases 15s infinite}
    .phrase.second{animation-delay:5s}.phrase.third{animation-delay:10s}
    .float{animation:float 5s ease-in-out infinite}.slow{animation-delay:-2.5s}
    .flow{stroke-dasharray:10 24;animation:flow 12s linear infinite}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes phrases{0%,26%{opacity:1}31%,100%{opacity:0}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @keyframes flow{to{stroke-dashoffset:-340}}
    @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.phrase,.float,.flow,.pulse{animation:none}.phrase.first{opacity:1}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1280" height="390" rx="24" fill="url(#bg)"/>
    <rect width="1280" height="390" fill="url(#grid)"/>
    <ellipse cx="346" cy="187" rx="461" ry="312" fill="url(#violet-glow)"/>
    <ellipse cx="1075" cy="117" rx="410" ry="332" fill="url(#cyan-glow)"/>
    <path d="M0 389H1280" stroke="url(#accent)" stroke-width="3"/>
    <path d="M192 1H1088" stroke="url(#accent)" stroke-width="2"/>
    <path class="flow" d="M0 370Q640 315 1280 370" stroke="url(#accent)" stroke-opacity=".28"/>
    <g font-family="Consolas,monospace" font-size="13" letter-spacing="2" fill="#6F85A7">
      <text x="30" y="36">PEDROHDA / GITHUB</text><text x="1250" y="36" text-anchor="end">&lt; / &gt;</text>
    </g>
    <g class="float" stroke="#67E8F9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".22"><path d="M118 148L88 178L118 208M154 148L184 178L154 208M145 135L128 221"/></g><g class="float slow" stroke="#A78BFA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".22"><path d="M1124 148L1094 178L1124 208M1160 148L1190 178L1160 208M1151 135L1134 221"/></g>
    <rect x="460" y="76" width="360" height="39" rx="20" fill="#A78BFA" fill-opacity=".08" stroke="#A78BFA" stroke-opacity=".3"/>
    <circle class="pulse" cx="485" cy="95" r="4" fill="#67E8F9"/>
    <text x="652" y="101" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="2" fill="#DDD6FE">DESENVOLVEDOR FULL STACK</text>
    <g text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-weight="750" letter-spacing="-3" fill="url(#name)"><text x="640" y="205" font-size="88">Pedro Domiciano<tspan fill="#67E8F9">.</tspan></text></g>
    <g text-anchor="middle" font-family="Consolas,monospace" font-size="25" fill="#A5F3FC">
      <text class="phrase first" x="640" y="268">Interfaces com propósito.</text>
      <text class="phrase second" x="640" y="268">APIs que conectam.</text>
      <text class="phrase third" x="640" y="268">Automações que simplificam.</text>
    </g>
    <text x="640" y="331" text-anchor="middle" font-family="Consolas,monospace" font-size="15" letter-spacing="2" fill="#91A6C5">WEB <tspan fill="#8B5CF6">/</tspan> DESKTOP <tspan fill="#8B5CF6">/</tspan> MOBILE</text>
  </g>
</svg>
